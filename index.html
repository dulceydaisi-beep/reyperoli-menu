<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reyperoli - Menú Digital Interactivo</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Google Fonts para tipografía Fast-Food -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Header de Marca -->
  <header class="header">
    <div class="header-overlay"></div>
    <div class="header-content">
      <div class="crown-badge">👑</div>
      <h1 class="brand-title">REYPEROLI</h1>
      <p class="brand-tagline">El verdadero sabor a tu puerta</p>
      <div class="delivery-status">
        <span class="dot-live"></span> Delivery Abierto
      </div>
    </div>
  </header>

  <!-- Contenedor Principal -->
  <main class="main-container">
    
    <!-- Filtro de Categorías Rápido -->
    <nav class="category-nav" id="category-nav"></nav>

    <!-- Menú Dinámico -->
    <section id="menu-container" class="menu-container"></section>

    <!-- Formulario de Checkout / Envío -->
    <section class="checkout-card">
      <h2 class="checkout-title">📍 Datos para el Envío</h2>
      
      <div class="form-group">
        <label for="name">Nombre y Apellido *</label>
        <input type="text" id="name" placeholder="Ej: María Pérez" required>
      </div>

      <div class="form-group">
        <label for="address">Dirección de Entrega / Barrio *</label>
        <input type="text" id="address" placeholder="Ej: San Martín 123, Dpto 2" required>
      </div>

      <div class="form-group">
        <label for="payment">Forma de Pago *</label>
        <select id="payment">
          <option value="Efectivo">Efectivo</option>
          <option value="Transferencia / Mercado Pago">Transferencia / Mercado Pago</option>
        </select>
      </div>

      <div class="form-group">
        <label for="notes">Aclaraciones o Notas (Opcional)</label>
        <input type="text" id="notes" placeholder="Ej: Sin cebolla / Paga con $10.000">
      </div>
    </section>
  </main>

  <!-- Barra Flotante de Carrito -->
  <footer class="cart-bar">
    <div class="cart-details">
      <span class="cart-label">Total a Pagar</span>
      <strong id="total-price" class="cart-price">$0</strong>
    </div>
    <button id="btn-send-whatsapp" class="btn-whatsapp">
      <span>Pedir por WhatsApp</span>
      <span class="whatsapp-icon">📲</span>
    </button>
  </footer>

  <script src="app.js"></script>
</body>
</html>
